version: "3.8"

services:
    mongo: 
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

    user-service:
      build: ./user-service
      container_name: user-service
      ports:
      - "5001:5001"
      depends_on:
      - mongo

    product-service:
      build: ./product-service
      container_name: product-service
      ports:
      - "5002:5002"
      depends_on:
      - mongo

    order-service:
      build: ./order-service
      container_name: order-service
      ports:
      - "5003:5003"
      depends_on:
      - mongo

    notification-service:
      build: ./notification-service
      container_name: notification-service
      ports:
      - "5004:5004"

    payment-service:
      build: ./payment-service
      container_name: payment-service
      ports:
      - "5005:5005"
      depends_on:
      - mongo

    cart-service:
      build: ./cart-service
      container_name: cart-service
      ports:
      - "5006:5006"
      depends_on:
      - mongo

volumes:
  mongo_data
