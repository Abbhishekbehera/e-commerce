
services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/user_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_SERVICE_PORT: 5001
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/product_db
      REDIS_URL: redis://redis:6379
      PRODUCT_SERVICE_PORT: 5002
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/order_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCT_SERVICE_URL: http://product-service:5002
      ORDER_SERVICE_PORT: 5003
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "5004:5004"
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NOTIFICATION_SERVICE_PORT: 5004
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PAYMENT_SERVICE_PORT: 5005
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "5006:5006"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/cart_db
      PRODUCT_SERVICE_URL: http://product-service:5002
      CART_SERVICE_PORT: 5006
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - ecommerce-network
    restart: on-failure

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
